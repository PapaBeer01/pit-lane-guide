/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* The site's typeface, loaded from the site's own fonts folder (this page lives at /teardown/rb22.html) */
@font-face{font-family:"Bricolage Grotesque";font-weight:200 800;font-stretch:100%;font-display:swap;src:url("../fonts/bricolage-grotesque-latin-wdth-wght.woff2") format("woff2")}
@font-face{font-family:"Bricolage Display";font-weight:200 800;font-stretch:75%;font-display:swap;src:url("../fonts/bricolage-grotesque-latin-wdth-wght.woff2") format("woff2")}
#app#app{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif}
#app#app .back,.back{font-family:"Bricolage Grotesque",Inter,sans-serif}

</style>

:root{--ink:#16181b;--ink2:#4b5058;--mute:#7a8088;--line:rgba(22,24,27,.1);--acc:#d6182b;--blue:#2f7fd8;--amber:#e98a00;--cyan:#12a8c0;--green:#1f9e5a}
html,body{margin:0;height:100%;background:#ecedef;overflow:hidden;font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.xbar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.xbar>*{pointer-events:auto}
.seg{display:flex;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.seg button{border:0;background:transparent;font:600 14px/1 inherit;font-family:inherit;color:var(--ink2);padding:9px 12px;border-radius:9px;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;font:600 14px/1 inherit;font-family:inherit;color:var(--ink);cursor:pointer;min-height:36px}
.chip i{width:26px;height:26px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.xhud{color:#16181b;position:absolute;left:12px;bottom:12px;display:none;gap:12px;align-items:flex-end;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-variant-numeric:tabular-nums;max-width:calc(100% - 24px);flex-wrap:wrap}
.xhud.on{display:flex}
.xhud b{font:800 28px/1 "Bricolage Display",inherit}
.xhud small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.xhud .meter{width:84px;height:6px;background:#e3e4e7;border-radius:3px;overflow:hidden;margin-top:6px}
.xhud .meter i{display:block;height:100%;background:var(--green)}
.pin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:var(--acc);color:#fff;font:700 13px/26px inherit;font-family:inherit;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:opacity .2s,transform .15s;padding:0}
.pin:hover,.pin.on{transform:scale(1.15)}
.pin.on{background:var(--ink)}
.sheet{color:#16181b;position:absolute;left:12px;right:12px;bottom:12px;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.sheet.on{display:block;animation:up .22s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.sheet h2{color:#16181b;margin:0 0 6px;font:800 22px/1.1 "Bricolage Display",inherit}
.sheet .ph{margin:0 0 10px;position:relative}.sheet .ph img{width:100%;height:130px;object-fit:cover;border-radius:10px;display:block}.sheet .ph figcaption{position:absolute;left:8px;bottom:8px;background:rgba(22,24,27,.75);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px}
.sheet p{margin:0 0 12px;color:var(--ink2);font-size:15px;line-height:1.45}
.sheet .xrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#f4f5f6;color:var(--ink);font:600 14px/1 inherit;font-family:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#f1f2f4;cursor:pointer;font-size:16px}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(22,24,27,.82);color:#fff;font-size:13px;padding:8px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.credit{position:absolute;right:10px;bottom:6px;font-size:10px;color:var(--mute);text-decoration:none}
.wheel{position:fixed;inset:0;background:rgba(236,237,239,.98);display:none;overflow:auto;z-index:20}
.wheel.on{display:block}
.wheel .in{max-width:760px;margin:0 auto;padding:16px}
.wheel h2{font:800 26px/1.1 "Bricolage Display",inherit;margin:4px 0 4px}
.wheel .lede{color:var(--ink2);margin:0 0 12px;font-size:15px}
.wpic{position:relative}
.wpic img{width:100%;height:auto;display:block;border-radius:16px}
.wdot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2.5px solid #d6182b;background:rgba(255,255,255,.18);cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.wdot.on{border-color:#16181b;background:rgba(22,24,27,.25);transform:scale(1.25)}
.winfo{min-height:72px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.winfo b{font:800 18px/1.2 "Bricolage Display",inherit;display:block;margin-bottom:4px}
.winfo span{color:var(--ink2)}
.load{position:fixed;inset:0;display:grid;place-items:center;background:#ecedef;z-index:30}
.load div{width:min(320px,80vw);display:grid;gap:10px;text-align:center}
.load b{font:800 20px/1.2 "Bricolage Display",inherit}
.load .t{height:6px;background:#d9dbdf;border-radius:3px;overflow:hidden}
.load .t i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.load span{color:var(--ink2)}
@media (max-width:560px){.seg button{padding:9px 9px;font-size:13px}.sheet{max-width:none}.xhud b{font-size:24px}}
