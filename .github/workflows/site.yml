name: Update data and publish site

on:
  schedule:
    - cron: "*/20 * * * 5,6,0,1"   # Friday to Monday (UTC): every 20 minutes, for race weekends
    - cron: "17 */6 * * 2,3,4"     # Tuesday to Thursday: every 6 hours (forecasts, late corrections)
  workflow_dispatch: {}             # "Run workflow" button for a manual update
  push:
    branches: [main]                # code changes are published straight away

permissions:
  contents: write
  actions: write                    # lets a run start the next one while old sessions are still loading
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      problems: ${{ steps.update.outputs.problems }}
      more: ${{ steps.update.outputs.more }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # F1's servers block GitHub's own network (FastF1 issue #988), but accept the same request,
      # with the F1 TV token, through Cloudflare WARP (free). Tested 27 Oct 2026: probe-results.md.
      # If WARP fails to start, the update still runs and reports the block in one clear message.
      - name: Connect through Cloudflare WARP
        id: warp
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then echo "WARP is on"; exit 0; fi
            sleep 2
          done
          echo "WARP did not connect"; warp-cli --accept-tos status; exit 1

      - name: Fetch new sessions, check them, update predictions
        id: update
        if: github.event_name != 'push'
        env:
          F1_SEASON: "2026"           # change once a year when a new season starts
          # F1 TV sign-in (needed for F1's timing data since Oct 2026), stored as encrypted repository secrets
          F1_USERNAME: ${{ secrets.F1_USERNAME }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
          FASTF1_AUTH_METHOD: password
        run: |
          python -m pipeline.update
          cat pipeline_status.txt >> "$GITHUB_OUTPUT" 2>/dev/null || true
          { echo "### Sessions"; echo; sed 's/^/- /' pipeline_status.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f pipeline_problems.txt ]; then
            echo "problems=$(wc -l < pipeline_problems.txt)" >> "$GITHUB_OUTPUT"
            { echo "### Data problems"; echo; sed 's/^/- /' pipeline_problems.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A short report saved in the repo (run-log/last-run.md) so problems can be read without
      # opening Actions. No times in it, so a quiet run doesn't create a commit.
      - name: Write run report
        if: always() && github.event_name != 'push'
        run: |
          mkdir -p run-log
          {
            echo "# Last update run with news"
            echo
            echo "- WARP: ${{ steps.warp.outcome }}"
            echo "- Update step: ${{ steps.update.outcome }}"
            sed 's/^/- /' pipeline_status.txt 2>/dev/null || echo "- no status written"
            echo
            echo "## Problems"
            echo
            if [ -f pipeline_problems.txt ]; then sed 's/^/- /' pipeline_problems.txt; else echo "None."; fi
          } > run-log/last-run.md

      - name: Disconnect WARP
        if: always() && github.event_name != 'push'
        run: warp-cli --accept-tos disconnect 2>/dev/null || true

      - name: Run tests
        run: pytest -q

      - name: Save new data
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for d in site/data history archive run-log; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      # Catch-up: while older sessions are still waiting (and this run loaded some), queue another run
      # straight away instead of waiting for the schedule. Stops by itself when nothing is left.
      - name: Start the next catch-up run
        if: steps.update.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs last so good data is always published first. Failing here makes GitHub email you.
  report:
    needs: [build, deploy]
    if: needs.build.outputs.problems != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Some sessions failed their data checks and were not published (the site kept the last good data)."
          echo "See the 'Data problems' summary on the build job. Usually this means F1's data wasn't ready yet; the next run retries."
          exit 1
